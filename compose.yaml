# =============================================================================
#  Textileria ERP - entorno LOCAL de desarrollo (Docker Desktop / Windows)
#
#    docker compose up -d --build        -> http://localhost:8080
#    docker compose --profile tools up -d -> + phpMyAdmin en http://localhost:8081
# =============================================================================
name: textileria

x-db-env: &db-env
  DATABASE_HOST: db
  DATABASE_PORT: 3306
  DATABASE_NAME: ${DB_NAME:-textileria}
  DATABASE_USER: ${DB_USER:-textileria}
  DATABASE_PASSWORD: ${DB_PASSWORD:-textileria}
  DATABASE_CHARSET: utf8mb4
  DATABASE_SERVER_VERSION: 10.11.2-MariaDB

services:
  app:
    build:
      context: .
      target: dev
      args:
        PHP_VERSION: 8.4.27
        INSTALL_XDEBUG: ${INSTALL_XDEBUG:-0}
    image: textileria-app:dev
    environment:
      <<: *db-env
      APP_ENV: dev
      APP_DEBUG: 1
      # 0 omite doctrine:migrations:migrate al arrancar (ver docker/entrypoint.sh)
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      # var/ en volumen nativo de Docker: mucho mas rapido que un bind mount en Windows
      - app_var:/var/www/html/var
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-textileria}
      MARIADB_USER: ${DB_USER:-textileria}
      MARIADB_PASSWORD: ${DB_PASSWORD:-textileria}
      TZ: America/Lima
    # Opciones por linea de comandos (en Windows los .cnf montados se ignoran por permisos)
    command:
      - --lower-case-table-names=1
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Se ejecuta SOLO la primera vez (volumen vacio): crea tablas y datos
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      - db

volumes:
  db_data:
  app_var:
