# yaml-language-server: $schema=../schema.json
# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        # La aplicacion legacy usa $_SESSION y session_start() directamente.
        # "php_bridge" hace que Symfony comparta esa misma sesion nativa de PHP.
        storage_factory_id: session.storage.factory.php_bridge
        handler_id: null
        isolate_attributes: true

    # Detras de un proxy/balanceador (despliegue remoto) confiar en X-Forwarded-*
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
