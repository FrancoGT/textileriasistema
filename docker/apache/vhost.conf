<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        Options -Indexes +FollowSymLinks

        # Front controller de Symfony: todo lo que no sea un archivo real
        # en public/ se envia a index.php (incluidas las rutas *.php del ERP).
        # (FallbackResource no sirve: el handler de PHP responde 404 a los .php
        #  inexistentes antes de que se aplique.)
        RewriteEngine On
        RewriteCond %{REQUEST_URI}::$0 ^(/.+)/(.*)::\2$
        RewriteRule .* - [E=BASE:%1]
        RewriteCond %{HTTP:Authorization} .+
        RewriteRule ^ - [E=HTTP_AUTHORIZATION:%0]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ %{ENV:BASE}/index.php [L]
    </Directory>

    # Ningun archivo fuera de public/ es accesible directamente
    <Directory /var/www/html>
        Require all denied
    </Directory>
    <Directory /var/www/html/public>
        Require all granted
    </Directory>

    # public/css y public/js se enlazan sin version en la URL: el navegador
    # debe revalidar (ETag) para ver los cambios en vez de usar una copia vieja.
    <FilesMatch "\.(css|js)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    # Cabeceras de seguridad basicas
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
